<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cron Expression Generator & CSV to JSON Converter | DevStudio Tools</title>
    <meta
      name="description"
      content="Free, private developer utilities: a cron expression generator, CSV to JSON converter, JSON diff checker, code beautifier and JSON string escaper. Runs 100% in your browser — no uploads."
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />
    <!-- Apply the saved theme (or the OS preference) before first paint to avoid a flash. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('devstudio-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="robots" content="index, follow" />
    <!-- Replace zensyntax.com with the production domain (also SITE_URL in src/App.jsx). -->
    <link rel="canonical" href="https://www.zensyntax.com/" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevStudio Tools" />
    <meta property="og:title" content="DevStudio Tools — Cron Generator & CSV to JSON Converter" />
    <meta
      property="og:description"
      content="Build cron schedules visually and convert CSV to JSON instantly. Private, offline, client-side developer tools."
    />
    <meta property="og:url" content="https://www.zensyntax.com/" />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DevStudio Tools",
        "url": "https://www.zensyntax.com/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Cron expression generator with custom hour and minute intervals",
          "Human-readable cron interpretation and next run preview",
          "CSV/TSV to JSON converter with header and type detection",
          "Side-by-side JSON diff checker with color-coded structural changes",
          "HTML, CSS and JavaScript code beautifier",
          "JSON string escape and unescape tool",
          "100% client-side processing"
        ]
      }
    </script>

    <!-- Google AdSense: uncomment after approval and replace the publisher ID.
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    -->
  </head>
  <body>
    <noscript>
      DevStudio Tools provides a cron expression generator and a CSV to JSON converter. JavaScript is required because all
      processing runs privately in your browser.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
